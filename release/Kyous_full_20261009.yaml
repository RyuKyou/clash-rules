# ============================================================
# Ryukyou full config (rules embedded, no HTTP rule-providers)
# yaml_version: Kyous-20261009
# rules_version: clash-rules@20261009
# generated_utc: 2026-10-09T11:00:04.199673+00:00
# notes: docs/KYOS_NOTES_20261009.md
# ============================================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - any:53
    - tcp://any:53
    - 0.0.0.0:53
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: true

sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  use-system-hosts: false
  prefer-h3: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://8.8.8.8:853
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.msftconnecttest.com": system
    "+.msftncsi.com": system
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "+.ts.net"
    - "time.windows.com"
    - "time.nist.gov"
    - "*.ntp.org"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"

proxy-providers:
  free-sub:
    type: http
    url: "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/1/config.yaml"
    interval: 3600
    path: ./providers/free-sub.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "[Free] "
  daily-nodes:
    type: http
    url: "https://raw.githubusercontent.com/RyuKyou/calendar-update-system/main/output/clash_clean.yaml"
    interval: 3600
    path: ./providers/daily-nodes.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "[Daily] "
  FQ:
    type: http
    url: "https://www.67867867.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/quick/1/config.yaml"
    interval: 3600
    path: ./providers/FQ.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "[FQ] "

proxy-groups:
  - name: 🐟 漏网之鱼
    type: select
    include-all: true
    proxies: [DIRECT, 🚀 故障轉移, ♻️ 自动选择, 🚀 手动切换]
  - name: 🚀 手动切换
    type: select
    include-all: true
    proxies: [♻️ 自动选择, 🚀 故障轉移, ⚖️ 負載均衡, DIRECT]
  - name: 🤖 AI
    type: select
    include-all: true
    proxies: [♻️ 自动选择, 🚀 手动切换, 🚀 故障轉移, DIRECT, REJECT]
  - name: 🎮 Steam
    type: select
    proxies: [🚀 手动切换, ♻️ 自动选择, 🚀 故障轉移, DIRECT]
  - name: 🎮 Steam下载
    type: select
    proxies: [DIRECT, 🎮 Steam, 🚀 手动切换, ♻️ 自动选择]
  - name: 🔞 Porn
    type: select
    include-all: true
    proxies: [🔞 RFT, 🚀 手动切换, ♻️ 自动选择, 🚀 故障轉移, REJECT, DIRECT]
  - name: 🛑 广告屏蔽
    type: select
    proxies: [REJECT, 🚀 手动切换, ♻️ 自动选择, DIRECT]
  - name: Microsoft
    type: select
    proxies: [DIRECT, 🚀 手动切换, ♻️ 自动选择]
  - name: 🎯 全球直连/版权区
    type: select
    proxies: [DIRECT, 🚀 手动切换]
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 🔞 RFT
    type: url-test
    include-all: true
    exclude-type: "ss|ssr|shadowsocks|vmess|http|socks5|hysteria|tuic|wireguard|anytls|snell"
    filter: "(?i)US|UK|NL|DE|CA|KR|SG|JP"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 🚀 故障轉移
    type: fallback
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: ⚖️ 負載均衡
    type: load-balance
    strategy: consistent-hashing
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 50

